<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="180" fill="url(#bg5)"/>

  <circle cx="512" cy="480" r="320" stroke="white" stroke-width="48" fill="none" opacity="1" filter="url(#glow5)"/>
  <path d="M 230 650 L 365 300 L 512 370 L 659 300 L 794 650" stroke="white" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" filter="url(#glow5)"/>
  <circle cx="512" cy="370" r="40" fill="white" opacity="1" filter="url(#glow5)"/>

  <!-- Mont 텍스트 - 부드러운 커브 폰트, 원 아래 -->
  <text x="512" y="870"
        font-family="SF Pro Rounded, -apple-system, system-ui"
        font-size="100"
        font-weight="500"
        letter-spacing="6"
        fill="white"
        text-anchor="middle"
        opacity="0.85">mont</text>
</svg>
