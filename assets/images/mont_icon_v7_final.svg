<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow7">
      <feGaussianBlur stdDeviation="9" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1024" height="1024" rx="180" fill="url(#bg7)"/>

  <!-- 오리지널 로고 (위로 이동, 약간 작게) -->
  <circle cx="512" cy="450" r="300" stroke="white" stroke-width="46" fill="none" opacity="1" filter="url(#glow7)"/>
  <path d="M 245 600 L 380 270 L 512 340 L 644 270 L 779 600" stroke="white" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" filter="url(#glow7)"/>
  <circle cx="512" cy="340" r="38" fill="white" opacity="1" filter="url(#glow7)"/>

  <!-- 엘레강스 텍스트 (하단) -->
  <text x="512" y="860"
        font-family="SF Pro Display, -apple-system, system-ui"
        font-size="120"
        font-weight="200"
        letter-spacing="18"
        fill="white"
        fill-opacity="0.85"
        text-anchor="middle">Mont</text>
</svg>
