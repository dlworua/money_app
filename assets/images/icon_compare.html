<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mont 아이콘 비교 - 7가지 버전</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Pro Display', -apple-system, system-ui;
            background: linear-gradient(135deg, #f0f9ff, #e0f2fe, #dbeafe);
            padding: 40px 20px;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        h1 {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #06B6D4, #14B8A6, #10B981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 18px;
            color: #64748b;
            font-weight: 400;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(20, 184, 166, 0.2);
        }
        .card.selected {
            border: 3px solid #14B8A6;
            box-shadow: 0 8px 30px rgba(20, 184, 166, 0.3);
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #14B8A6;
            margin-bottom: 6px;
            text-align: center;
        }
        .card-desc {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 18px;
            text-align: center;
            min-height: 36px;
            line-height: 1.4;
        }
        canvas {
            width: 100%;
            height: auto;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .download-section {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .selected-title {
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 20px;
        }
        .download-btn {
            background: linear-gradient(135deg, #06B6D4, #14B8A6);
            color: white;
            border: none;
            padding: 18px 48px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(20, 184, 166, 0.3);
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(20, 184, 166, 0.4);
        }
        .badge {
            display: inline-block;
            padding: 5px 10px;
            background: #fef3c7;
            color: #92400e;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }
        .badge.new {
            background: #dbeafe;
            color: #1e40af;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎨 Mont 아이콘 비교</h1>
        <p class="subtitle">로고와 조화로운 부드러운 디자인 추가 ✨</p>
    </div>

    <div class="container">
        <div class="grid">
            <div class="card selected" data-version="original">
                <div class="card-title">오리지널</div>
                <div class="card-desc">텍스트 없이 로고만<br>심플하고 깔끔</div>
                <canvas id="canvas-original" width="256" height="256"></canvas>
                <div class="badge">현재</div>
            </div>

            <div class="card" data-version="v4">
                <div class="card-title">하모니</div>
                <div class="card-desc">원 안에 Mont<br>로고와 조화로운 배치</div>
                <canvas id="canvas-v4" width="256" height="256"></canvas>
                <div class="badge new">NEW</div>
            </div>

            <div class="card" data-version="v5">
                <div class="card-title">소프트</div>
                <div class="card-desc">원 아래 mont<br>부드러운 분위기</div>
                <canvas id="canvas-v5" width="256" height="256"></canvas>
                <div class="badge new">NEW</div>
            </div>

            <div class="card" data-version="v6">
                <div class="card-title">밸런스드</div>
                <div class="card-desc">원 안 mont + 발광<br>완벽한 균형</div>
                <canvas id="canvas-v6" width="256" height="256"></canvas>
                <div class="badge new">NEW</div>
            </div>

            <div class="card" data-version="v1">
                <div class="card-title">클래식</div>
                <div class="card-desc">하단 mont<br>우아하고 정돈된</div>
                <canvas id="canvas-v1" width="256" height="256"></canvas>
            </div>

            <div class="card" data-version="v2">
                <div class="card-title">컴팩트</div>
                <div class="card-desc">원 안쪽 mont<br>통합 디자인</div>
                <canvas id="canvas-v2" width="256" height="256"></canvas>
            </div>

            <div class="card" data-version="v3">
                <div class="card-title">엘레강스</div>
                <div class="card-desc">얇은 Mont<br>프리미엄 느낌</div>
                <canvas id="canvas-v3" width="256" height="256"></canvas>
            </div>

            <div class="card" data-version="v7">
                <div class="card-title">파이널 ⭐</div>
                <div class="card-desc">오리지널 로고 + 엘레강스 텍스트<br>완벽한 조합</div>
                <canvas id="canvas-v7" width="256" height="256"></canvas>
                <div class="badge new">BEST</div>
            </div>
        </div>

        <div class="download-section">
            <div class="selected-title">선택: <span id="selected-name">오리지널</span></div>
            <button class="download-btn" onclick="downloadSelected()">📥 1024x1024 PNG 다운로드</button>
        </div>
    </div>

    <canvas id="full-canvas" width="1024" height="1024" style="display:none;"></canvas>

    <script src="icon_compare_data.js"></script>
</body>
</html>
