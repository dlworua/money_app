<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="180" fill="url(#bg4)"/>

  <circle cx="512" cy="512" r="340" stroke="white" stroke-width="50" fill="none" opacity="1" filter="url(#glow4)"/>
  <path d="M 220 672 L 370 320 L 512 395 L 654 320 L 804 672" stroke="white" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" filter="url(#glow4)"/>
  <circle cx="512" cy="395" r="42" fill="white" opacity="1" filter="url(#glow4)"/>

  <!-- Mont 텍스트 - 로고와 조화롭게, 원 안쪽 하단 -->
  <text x="512" y="740"
        font-family="SF Pro Rounded, -apple-system, BlinkMacSystemFont, system-ui"
        font-size="90"
        font-weight="400"
        letter-spacing="5"
        fill="white"
        text-anchor="middle"
        opacity="0.88"
        style="paint-order: stroke; stroke: rgba(255,255,255,0.2); stroke-width: 1px;">Mont</text>
</svg>
