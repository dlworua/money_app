<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="180" fill="url(#bg6)"/>

  <circle cx="512" cy="490" r="330" stroke="white" stroke-width="48" fill="none" opacity="0.98" filter="url(#glow6)"/>
  <path d="M 220 665 L 365 305 L 512 375 L 659 305 L 804 665" stroke="white" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.98" filter="url(#glow6)"/>
  <circle cx="512" cy="375" r="40" fill="white" opacity="0.98" filter="url(#glow6)"/>

  <!-- Mont 텍스트 - 원과 완벽하게 조화, 원 안 하단 -->
  <text x="512" y="750"
        font-family="SF Pro Rounded, -apple-system, system-ui"
        font-size="95"
        font-weight="450"
        letter-spacing="7"
        fill="white"
        text-anchor="middle"
        opacity="0.90"
        filter="url(#textGlow)">mont</text>
</svg>
