<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 로고 심볼 (M자 산) -->
  <g transform="translate(35, 60)">
    <!-- 왼쪽 산 -->
    <path d="M -25 15 L -25 -10 L -12.5 10 L 0 -15"
          stroke="#14B8A6"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- 오른쪽 산 -->
    <path d="M 0 -15 L 12.5 10 L 25 -10 L 25 15"
          stroke="#14B8A6"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- 중앙 포인트 -->
    <circle cx="0" cy="-15" r="3" fill="#14B8A6"/>
  </g>

  <!-- 텍스트: Mont (다크모드 - 흰색) -->
  <text x="80" y="75"
        font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42"
        font-weight="700"
        fill="#FFFFFF"
        letter-spacing="-1">Mont</text>
</svg>
