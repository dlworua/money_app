<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 그라데이션 (강렬한 teal-to-emerald) -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>

    <!-- 발광 효과 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 그림자 효과 -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1024" height="1024" rx="180" fill="url(#bgGradient)"/>

  <!-- 동전 외곽 (중앙, 크게, 발광 효과) -->
  <circle cx="512" cy="512" r="340"
          stroke="white"
          stroke-width="50"
          fill="none"
          opacity="1"
          filter="url(#glow)"/>

  <!-- 산 모양 (M자 형태, 굵고 선명하게) -->
  <path d="M 250 680 L 370 310 L 512 385 L 654 310 L 774 680"
        stroke="white"
        stroke-width="65"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        opacity="1"
        filter="url(#shadow)"/>

  <!-- 정상 점 (목표 지점, 더 크고 발광) -->
  <circle cx="512" cy="385" r="42"
          fill="white"
          opacity="1"
          filter="url(#glow)"/>

  <!-- 정상 강조 링 -->
  <circle cx="512" cy="385" r="60"
          stroke="white"
          stroke-width="4"
          fill="none"
          opacity="0.4"/>
</svg>
