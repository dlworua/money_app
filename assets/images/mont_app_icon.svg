<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 그라데이션 (강렬한 teal-to-emerald) -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>

    <!-- 발광 효과 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1024" height="1024" rx="180" fill="url(#bgGradient)"/>

  <!-- 동전 외곽 (중앙, 크게, 발광 효과) -->
  <circle cx="512" cy="512" r="340"
          stroke="white"
          stroke-width="50"
          fill="none"
          opacity="1"
          filter="url(#glow)"/>

  <!-- 산 모양 (M자 형태) - 동그라미와 완벽하게 연결 -->
  <!-- stroke-width가 50이므로, 외곽선 중심까지 정확히 맞춤 -->
  <!-- 원의 중심(512, 512), 반지름 340, 45도 각도 기준 계산 -->
  <path d="M 220 652 L 370 310 L 512 385 L 654 310 L 804 652"
        stroke="white"
        stroke-width="50"
        stroke-linecap="butt"
        stroke-linejoin="miter"
        fill="none"
        opacity="1"
        filter="url(#glow)"/>

  <!-- 정상 점 (목표 지점, 더 크고 발광) -->
  <circle cx="512" cy="385" r="42"
          fill="white"
          opacity="1"
          filter="url(#glow)"/>
</svg>
