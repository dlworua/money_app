<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 그라데이션 (강렬한 teal-to-emerald) -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>

    <!-- 발광 효과 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 그림자 효과 -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1024" height="1024" rx="180" fill="url(#bgGradient)"/>

  <!-- 산 모양 (M자 형태) - 동그라미와 자연스럽게 연결 -->
  <path d="M 220 720 L 350 280 L 512 365 L 674 280 L 804 720"
        stroke="white"
        stroke-width="75"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        opacity="0.98"
        filter="url(#glow)"/>

  <!-- 정상 점 (목표 지점) - 산과 자연스럽게 연결 -->
  <circle cx="512" cy="365" r="50"
          fill="white"
          opacity="0.98"
          filter="url(#glow)"/>
</svg>
